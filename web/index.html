<style>
	body {
		background-color: black;
		color: white;
		font-family: mono;

		display: flex;
		flex-direction: column;
		align-items: center;

		gap: 3px;
	}

	c {
		display: grid;
		grid-template-columns: repeat(9, 1fr);

		width: 450px;
	}

	d {
		height: 48px;
		width: 48px;
		background-color: gray;
		border: 1px solid white;
	}
</style>

<h1>Mindsweeper, now packaged as Dumbsweeper!</h1>

<c>
	<d></d>
</c>

<script>
	const ROWS = 9;
	const COLS = 9;
	const boardElement = document.querySelector('c');

	for (let i = 1; i < ROWS * COLS; i++) {
		const cell = document.createElement('d');
		boardElement.appendChild(cell);
	}
</script>
